<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta http-equiv="refresh" content="3;url=https://script.google.com/macros/s/AKfycbybWeO3vbo1RZ228C89-geR17go7-IiInowoLwKU5GtnzwlzqE_wxLY5ZerlXqmn00T/exec">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/android-chrome-192x192.png">
  <title>V-GAS — Инвентаризация</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:24px;font:17px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#172033;background:#f4f7f8;min-height:100vh;display:grid;place-items:center}main{width:100%;max-width:520px;border:1px solid #d8e1e8;border-radius:16px;background:#fff;padding:28px}h1{font-size:24px;color:#0f766e;margin:0 0 14px}p{margin:0 0 20px}a{display:inline-block;background:#0f766e;color:white;padding:13px 18px;border-radius:10px;text-decoration:none;font-weight:650}small{display:block;margin-top:16px;color:#607083}
  </style>
</head>
<body>
  <main>
    <h1>V-GAS · Инвентаризация</h1>
    <p>Отваряме новата електронна бланка в Google.</p>
    <a href="https://script.google.com/macros/s/AKfycbybWeO3vbo1RZ228C89-geR17go7-IiInowoLwKU5GtnzwlzqE_wxLY5ZerlXqmn00T/exec" target="_self" rel="noopener">Отвори бланката</a>
    <small>Използвай личния си Google акаунт.</small>
  </main>
  <script>
  (function () {
    const destination = 'https://script.google.com/macros/s/AKfycbybWeO3vbo1RZ228C89-geR17go7-IiInowoLwKU5GtnzwlzqE_wxLY5ZerlXqmn00T/exec';
    let redirected = false;
    function openForm() {
      if (redirected) return;
      redirected = true;
      window.location.replace(destination);
    }
    setTimeout(openForm, 1500);
    if (!('serviceWorker' in navigator)) { openForm(); return; }
    navigator.serviceWorker.getRegistration(new URL('./', window.location.href).href)
      .then(function (registration) {
        if (registration) return registration.update();
      })
      .then(openForm, openForm);
  }());
  </script>
</body>
</html>
